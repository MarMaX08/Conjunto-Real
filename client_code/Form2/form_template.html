<anvil-form layout="Conjunto_Real.Layouts.BaseLayout">
  <anvil-block slot="title">
    <anvil-component type="Label" name="label_1" prop:text="Actual assessment" prop:bold="true" prop:font_size="36"></anvil-component>
    <anvil-component type="Label" name="label_9" prop:text="ASTRONAUT DATA" prop:bold="true" prop:align="left"></anvil-component>
  </anvil-block>
  <anvil-block slot="content">
    <anvil-component type="Label" name="label_11" prop:text="Enter the standard data" prop:underline="false" prop:italic="false" prop:bold="true"></anvil-component>
    <anvil-component type="Label" name="label_12" prop:text="The data you provide will be compared against established values ​​to assess your health status."></anvil-component>
    <anvil-component type="FlowPanel" name="flow_panel_5">
      <anvil-component type="Label" name="label_6" prop:text="Full name:"></anvil-component>
      <anvil-component type="TextBox" name="nombre" prop:text="" container:expand="true"></anvil-component>
    </anvil-component>
    <anvil-component type="FlowPanel" name="flow_panel_3" prop:align="left">
      <anvil-component type="Label" name="label_4" prop:text="Age (Years):"></anvil-component>
      <anvil-component type="TextBox" name="edad" container:width="null" container:expand="true"></anvil-component>
    </anvil-component>
    <anvil-component type="FlowPanel" name="flow_panel_1" prop:align="left">
      <anvil-component type="Label" name="label_2" prop:text="Mass (kg):"></anvil-component>
      <anvil-component type="TextBox" name="masa" container:width="null" container:expand="true"></anvil-component>
    </anvil-component>
    <anvil-component type="FlowPanel" name="flow_panel_9" prop:align="left">
      <anvil-component type="Label" name="label_13" prop:text="Height (years)"></anvil-component>
      <anvil-component type="TextBox" name="estatura" container:width="null" container:expand="true"></anvil-component>
    </anvil-component>
    <anvil-component type="FlowPanel" name="flow_panel_2" prop:align="left">
      <anvil-component type="Label" name="label_3" prop:text="Systolic blood pressure (mm Hg):"></anvil-component>
      <anvil-component type="TextBox" name="presiona" prop:align="left" container:width="855" container:expand="true"></anvil-component>
    </anvil-component>
    <anvil-component type="FlowPanel" name="flow_panel_7" prop:align="left">
      <anvil-component type="Label" name="label_8" prop:text="Diastolic blood pressure (mm Hg):"></anvil-component>
      <anvil-component type="TextBox" name="presionb" container:width="null" container:expand="true"></anvil-component>
    </anvil-component>
    <anvil-component type="FlowPanel" name="flow_panel_8" prop:align="left">
      <anvil-component type="Label" name="label_10" prop:text="Blood glucose (mg/dL)"></anvil-component>
      <anvil-component type="TextBox" name="glucosa" container:width="null" container:expand="true"></anvil-component>
    </anvil-component>
    <anvil-component type="FlowPanel" name="flow_panel_4" prop:align="left">
      <anvil-component type="Label" name="label_5" prop:text="Heart rate (bpm):"></anvil-component>
      <anvil-component type="TextBox" name="pulso" container:width="null" container:expand="true"></anvil-component>
    </anvil-component>
    <anvil-component type="FlowPanel" name="flow_panel_6" prop:align="left">
      <anvil-component type="Label" name="label_7" prop:text="O₂ saturation (%):"></anvil-component>
      <anvil-component type="TextBox" name="o2" container:width="null" container:expand="true"></anvil-component>
    </anvil-component>
    <anvil-component type="FlowPanel" name="flow_panel_10" prop:align="center">
      <anvil-component type="Button" name="button_1" prop:text="Go out"></anvil-component>
      <anvil-component type="Button" name="button_2" prop:text="Add astronaut" prop:align="center"></anvil-component>
    </anvil-component>
  </anvil-block>
  <anvil-block slot="actions"></anvil-block>
</anvil-form>
