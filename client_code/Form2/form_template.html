<anvil-form layout="Conjunto_Real.Layouts.BaseLayout">
  <anvil-block slot="title">
    <anvil-component type="Label" name="label_1" prop:text="Evaluación Real" prop:bold="true" prop:font_size="36"></anvil-component>
  </anvil-block>
  <anvil-block slot="content">
    <anvil-component type="TextBox" name="text_box_1" prop:text="Nombre y apellido"></anvil-component>
    <anvil-component type="FlowPanel" name="flow_panel_1" prop:align="left">
      <anvil-component type="Label" name="label_2" prop:text="Masa (Kg):"></anvil-component>
      <anvil-component type="TextBox" name="text_box_2" container:width="null" container:expand="true"></anvil-component>
    </anvil-component>
    <anvil-component type="FlowPanel" name="flow_panel_2" prop:align="left">
      <anvil-component type="Label" name="label_3" prop:text="Presión arterial normal (mm Hg):"></anvil-component>
      <anvil-component type="TextBox" name="text_box_3" prop:align="left" container:width="855" container:expand="true"></anvil-component>
    </anvil-component>
    <anvil-component type="Button" name="button_1" prop:text="Añadir astronauta"></anvil-component>
  </anvil-block>
</anvil-form>
